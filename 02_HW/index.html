<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    
    <div class="container mt-4">

        <div class="row g-3">

            <div class="col-12 col-sm-6 col-lg-3">
                <input id="txt1" type="text" class="form-control">
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <input id="txt2" type="text" class="form-control">
            </div>

            <div class="col-12 col-sm-6 col-lg-2">
                <select id="op" class="form-select">
                    <option value="+">+</option>
                    <option value="-">−</option>
                    <option value="*">×</option>
                    <option value="/">÷</option>
                </select>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <button id="btnCalc" class="btn btn-primary w-100"> = </button>
            </div>

            <div class="col-sm-2">
                <h3 id="lblRes" class="text-success"></h3>
            </div>

        </div>

    </div>

    <br>

    <div class="container mt-4 justify-content-center">
        <textarea id="output" class="form-control" style="height: 300px; resize: none;"></textarea>
    </div>
    
</body>
<script src="index.js"></script>
</html>
